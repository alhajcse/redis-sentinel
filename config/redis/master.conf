# Redis Master — reference config (actual config via docker-compose)
bind 0.0.0.0
port 6379
protected-mode no

# Authentication
requirepass <injected-via-env>
masterauth  <injected-via-env>

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Replication announce (for Sentinel)
announce-ip 10.70.16.236
announce-port 6379