# Redis Replica — reference config (actual config via docker-compose)
bind 0.0.0.0
port 6379
protected-mode no

# Authentication
requirepass <injected-via-env>
masterauth  <injected-via-env>

# Replication
replicaof redis-master 6379
replica-read-only yes

# Persistence
appendonly yes
appendfsync everysec

# Announce (for Sentinel)
replica-announce-ip 10.70.16.236
replica-announce-port <6380 or 6381>