services:
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    hostname: redis-master
    restart: unless-stopped
    networks: [redis-net]
    ports: ["6379:6379"]
    volumes:
      - redis-master-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    hostname: redis-replica-1
    restart: unless-stopped
    networks: [redis-net]
    ports: ["6380:6379"]
    depends_on:
      redis-master: {condition: service_healthy}
    volumes:
      - redis-replica-1-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --replicaof redis-master 6379 \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    hostname: redis-replica-2
    restart: unless-stopped
    networks: [redis-net]
    ports: ["6381:6379"]
    depends_on:
      redis-master: {condition: service_healthy}
    volumes:
      - redis-replica-2-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --replicaof redis-master 6379 \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6381
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  sentinel-1:
    image: redis:7.2-alpine
    container_name: sentinel-1
    hostname: sentinel-1
    restart: unless-stopped
    networks: [redis-net]
    ports: ["26379:26379"]
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-1-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --sentinel announce-ip ${REDIS_HOST} \
          --sentinel announce-port 26379 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

  sentinel-2:
    image: redis:7.2-alpine
    container_name: sentinel-2
    hostname: sentinel-2
    restart: unless-stopped
    networks: [redis-net]
    ports: ["26380:26379"]
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-2-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --sentinel announce-ip ${REDIS_HOST} \
          --sentinel announce-port 26380 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

  sentinel-3:
    image: redis:7.2-alpine
    container_name: sentinel-3
    hostname: sentinel-3
    restart: unless-stopped
    networks: [redis-net]
    ports: ["26381:26379"]
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-3-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --sentinel announce-ip ${REDIS_HOST} \
          --sentinel announce-port 26381 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

networks:
  redis-net:
    driver: bridge

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
