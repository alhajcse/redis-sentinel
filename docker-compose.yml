services:
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-master-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 6379 \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis-master: {condition: service_healthy}
    volumes:
      - redis-replica-1-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 6380 \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --replicaof 10.70.16.236 6379 \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6380
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6380 ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis-master: {condition: service_healthy}
    volumes:
      - redis-replica-2-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 6381 \
          --requirepass "$$REDIS_PASSWORD" \
          --masterauth "$$REDIS_PASSWORD" \
          --replicaof 10.70.16.236 6379 \
          --appendonly yes \
          --replica-announce-ip 10.70.16.236 \
          --replica-announce-port 6381
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6381 ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  sentinel-1:
    image: redis:7.2-alpine
    container_name: sentinel-1
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-1-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --port 26379 \
          --sentinel announce-ip 10.70.16.236 \
          --sentinel announce-port 26379 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

  sentinel-2:
    image: redis:7.2-alpine
    container_name: sentinel-2
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-2-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --port 26380 \
          --sentinel announce-ip 10.70.16.236 \
          --sentinel announce-port 26380 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

  sentinel-3:
    image: redis:7.2-alpine
    container_name: sentinel-3
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis-master: {condition: service_healthy}
      redis-replica-1: {condition: service_healthy}
      redis-replica-2: {condition: service_healthy}
    volumes:
      - ./config/sentinel/sentinel.conf:/etc/sentinel-base.conf:ro
      - sentinel-3-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /data/sentinel.conf ] || cp /etc/sentinel-base.conf /data/sentinel.conf
        exec redis-sentinel /data/sentinel.conf \
          --port 26381 \
          --sentinel announce-ip 10.70.16.236 \
          --sentinel announce-port 26381 \
          --sentinel auth-pass mymaster "$$REDIS_PASSWORD"

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
